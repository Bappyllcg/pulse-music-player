<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pulse" />
  <meta name="theme-color" content="#08080c" id="theme-color-meta" />
  <meta name="color-scheme" content="light dark" />
  <style>
    html,
    body {
      background-color: #08080c;
      margin: 0;
      padding: 0;
    }

    html.light,
    html.light body {
      background-color: #f4f4f8;
    }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('pulse:theme') || 'system';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = t === 'dark' || (t === 'system' && prefersDark);
        var effective = isDark ? 'dark' : 'light';
        var themeHex = isDark ? '#08080c' : '#f4f4f8';
        var root = document.documentElement;

        if (isDark) {
          root.classList.add('dark');
          root.classList.remove('light');
          root.setAttribute('data-theme', 'dark');
          root.style.colorScheme = 'dark';
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
          root.setAttribute('data-theme', 'light');
          root.style.colorScheme = 'light';
        }

        var meta = document.getElementById('theme-color-meta') || document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', themeHex);
        }
      } catch (e) { }
    })();
  </script>
  <meta name="description" content="Pulse Player - an offline-first music player for your own audio files." />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Inter:wght@400..700&display=swap"
    rel="stylesheet" />
  <title>Pulse Player</title>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-[#08080c] dark:text-zinc-100">
  <div id="app"></div>
  <noscript>Pulse Player requires JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
